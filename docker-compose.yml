services:
  # ⚙️ BACKEND (Spring Boot)
  backend:
    build:
      context: ./Workflow
      dockerfile: Dockerfile
    container_name: kyntus-backend
    restart: always
    ports:
      - "8082:8082"
    environment:
      # 🔥 Khelina .50 hna hit l'DB bqat f l'host l-qdim, kheliha haka s7i7a!
      - SPRING_DATASOURCE_URL=jdbc:postgresql://10.10.10.50:5432/kyntus_db
      - SPRING_DATASOURCE_USERNAME=kyntus_user
      - SPRING_DATASOURCE_PASSWORD=kyntus_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=500MB
      - SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=500MB
      # 🧾 Chhal mn facture mezyana f nefs l-weqt. 1 = ma-ykoun-ch 2 users
      #    kay-generiw f nefs l-weqt w kay-9tlou l-RAM. Zidha 2 ila 3endek RAM.
      - FACTURE_MAX_CONCURRENT=1

    # 🧠 PLAFOND RAM : BEDDELHA 7SEB RAM DYAL SERVER DYALEK !
    #    Qa3ida : khellí ~2 Go l l'OS + l-frontend.
    #    Server 8 Go  -> mem_limit: 5g
    #    Server 16 Go -> mem_limit: 12g
    #    L'JVM kat-khod 70% mn had r-raqm automatiquement (MaxRAMPercentage).
    mem_limit: 5g
    memswap_limit: 5g

    # 🩺 HEALTHCHECK : ila l'JVM tbloka (OOM / GC thrashing) had l-endpoint
    #    ma-kay-jawb-ch, Docker kay-3ref bli l-conteneur mrid.
    #    start_period kbira hit Spring + Hibernate ddl-auto kay-khdiw we9t.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O - http://127.0.0.1:8082/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

    # 📋 Logs bla ma y-3emmrou l-disque (kanou kay-mchiw bla 7doud)
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # 🌐 FRONTEND (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        # ⚠️ MOHIM : Next.js kay-"cuisini" les rewrites f l-BUILD, machi f
        #    l-runtime. Yaani HAD l-valeur hiya li kat-khdem f l'proxy /api.
        #    'backend' = l-DNS dyal docker, kay-khdem dakhel r-reseau dyal compose.
        BACKEND_URL: http://backend:8082
    container_name: kyntus-frontend
    restart: always
    ports:
      # 🔥 Tbedlat mn 3000 l 3827
      - "3827:3827"
    depends_on:
      backend:
        # Frontend ma-kay-tlance-ch 7ta ykoun l-backend jahez -> ma-b9ach
        # dak "Internal Server Error" dyal l-proxy f l-bdaya.
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=/api
      # 👇 Khellih KIF-KIF b l-build arg l-fou9 (bach ma-twelli-ch tay7
      #    f confusion : qbel kan build=http://backend:8082 w
      #    runtime=http://10.10.10.25:8082, w l-runtime ma-kan-ch kay-khdem walou)
      - BACKEND_URL=http://backend:8082
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:3827/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
