version: '3.8'

services:
  # ⚙️ BACKEND (Spring Boot)
  backend:
    build: 
      context: ./Workflow
      dockerfile: Dockerfile
    container_name: kyntus-backend
    restart: always
    ports:
      - "8082:8082"
    environment:
      # 🔥 Khelina .50 hna hit l'DB bqat f l'host l-qdim, kheliha haka s7i7a!
      - SPRING_DATASOURCE_URL=jdbc:postgresql://10.10.10.50:5432/kyntus_db
      - SPRING_DATASOURCE_USERNAME=kyntus_user
      - SPRING_DATASOURCE_PASSWORD=kyntus_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=500MB
      - SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=500MB

  # 🌐 FRONTEND (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        BACKEND_URL: http://backend:8082
    container_name: kyntus-frontend
    restart: always
    ports:
      # 🔥 Tbedlat mn 3000 l 3827
      - "3827:3827"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - BACKEND_URL=http://10.10.10.25:8082