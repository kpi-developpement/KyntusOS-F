# ===============================
# DATABASE CONFIGURATION (Hybrid: Local + Docker/Prod)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kyntus_db?reWriteBatchedInserts=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:waeloujdiastral481123456}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=30

# ===============================
# HIBERNATE & JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# LOGS & PERFORMANCE OPTIMIZATION
# ===============================
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=ERROR

# ===============================
# SERVER CONFIGURATION & TIMEOUTS
# ===============================
server.port=${SERVER_PORT:8082}

server.tomcat.max-threads=50
server.tomcat.accept-count=100

# ===============================
# MULTIPART / UPLOAD LIMITS
# ===============================
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# ===============================
# ? OMNI SEARCH & JSON FIXES ?
# ===============================
# -1 kat3ni "Accept ay taille dyal JSON" bach l'array dyal les EPS mayt'blokach
server.tomcat.max-http-form-post-size=-1
spring.jackson.default-property-inclusion=non_null

spring.servlet.multipart.location=/tmp/

# 🔥 HAD S-STER KAY-KHELLI SPRING MA-Y-ZREBCH Y-QRA L-FICHIER 7ETA Y-WSEL KAML
spring.servlet.multipart.resolve-lazily=true
server.tomcat.connection-timeout=300000
server.tomcat.keep-alive-timeout=300000
server.address=0.0.0.0


# ===============================
# CONNECTION POOL (HIKARI) - ANTI "TOUT EST EN 500"
# ===============================
# Bla had les timeouts, ila Postgres (10.10.10.50) bqa ma-kay-jawbch, les threads
# dyal Tomcat kay-tse3l9o kolhom f getConnection() w l-API kamla kat-bloka.
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=1740000
spring.datasource.hikari.leak-detection-threshold=120000
spring.datasource.hikari.minimum-idle=5
# Timeout dyal l-socket PostgreSQL (thwani) : requete m-3ellqa kat-tqte3 wa7adha
spring.datasource.hikari.data-source-properties.socketTimeout=600
spring.datasource.hikari.data-source-properties.connectTimeout=10
spring.datasource.hikari.data-source-properties.loginTimeout=10
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true

# ===============================
# FACTURE : chhal mn generation f nefs l-weqt (RAM guard)
# ===============================
facture.max-concurrent=${FACTURE_MAX_CONCURRENT:1}
